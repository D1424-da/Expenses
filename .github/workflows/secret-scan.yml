name: 秘密情報スキャン

# PR で追加された行だけを見る（main push 時は省略して Actions 分数を節約）。
#
# 2026-06、Gemini の API キー3つがコミットされ、公開リポジトリの git 履歴に
# 約2か月半残っていた。現在のファイルから消しても履歴は誰でも読めるので、
# **入る前に止める**のがこの検査の役割。
on:
  pull_request:
  workflow_dispatch:
    inputs:
      full_history:
        description: "全履歴を走査する（公開設定を変える前に実行）"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  scan:
    name: 追加行の秘密情報
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 差分を取るためベースとの共通祖先まで必要。
          # 全履歴走査を選んだときは全部要る。
          fetch-depth: ${{ inputs.full_history && 0 || 50 }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      # 依存なし（標準ライブラリと git だけ）なので pip install は不要。

      - name: 追加行を走査
        if: ${{ !inputs.full_history }}
        run: |
          git fetch --no-tags --depth=50 origin "${{ github.base_ref }}"
          python3 scripts/scan_secrets.py --range "origin/${{ github.base_ref }}...HEAD"

      - name: 全履歴を走査
        if: ${{ inputs.full_history }}
        run: python3 scripts/scan_secrets.py --history

      - name: 見つかったときの案内
        if: failure()
        run: |
          echo "::error::秘密情報らしき値が追加行に含まれています。"
          echo "対処の順番:"
          echo "  1. その資格情報を発行元で無効化する（履歴の書き換えより先）"
          echo "     — 公開リポジトリでは push した時点で読まれた前提で動くこと"
          echo "  2. コードから消し、環境変数から読むよう直す"
          echo "  3. 公開前提の値なら scripts/scan_secrets.py の ALLOW に理由つきで足す"
          echo "詳しくは docs/作業備忘録-2026-08-29-秘密情報の棚卸し.md"
