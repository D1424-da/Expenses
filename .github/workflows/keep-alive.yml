name: Keep Render Alive

# Render 無料プランは 15 分アイドルでスリープし、復帰に 30〜60 秒かかる。
# それを避けるために /api/health を定期的に叩く。
#
# ## 実行時間帯を絞っている理由（2026-08 の事故）
#
# 以前は `*/10 * * * *`（24時間・10分ごと）で回していた。ファイルには
# 「1回あたり約10秒・月間約720分」と書いてあったが、**この見積もりは誤り**。
# GitHub Actions は**ジョブ1回につき最低1分**として課金される（10秒で
# 終わっても1分）。
#
#   1日144回 × 1分 = 144分/日 = 約4,320分/月
#   プライベートリポジトリの無料枠 = 2,000分/月
#
# 14日ほどで枠を使い切り、**pytest・vitest・Firebase Hosting への
# デプロイまで含めて全ワークフローが起動不能**になった（ジョブが3秒で
# 失敗し、ログも残らない）。
#
# ## なぜ「間隔を延ばす」ではなく「時間帯を絞る」なのか
#
# 15分を超える間隔にすると、叩く時点で必ずスリープ済みになる。
# 起こしているだけで、利用者の待ち時間は変わらない。
# **10分間隔を保ったまま、動かす時間帯を絞る**ほうが目的に合う。
#
#   9-13 UTC = 18:00〜22:59 JST（夕食・家計簿をつける時間帯）
#   1日30回 × 1分 = 30分/日 = 約900分/月
#
# それ以外の時間帯はスリープする。その時間に来た利用者は初回だけ
# 30〜60秒待つことになるが、CI とデプロイの枠を残すことを優先した。
#
# 時間帯は GA4 のアクセス時間を見て見直すこと。
on:
  schedule:
    - cron: "*/10 9-13 * * *"   # 18:00〜22:59 JST を10分ごと
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          # curl 自体が失敗（DNS/タイムアウト等）しても set -e でジョブごと
          # 落とさないよう、失敗時は "000" にフォールバックする。
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            https://receipt-ocr-ejrl.onrender.com/api/health || echo "000")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Render is awake"
          else
            echo "⚠️ Render returned $STATUS（一時的なコールドスタートの可能性あり。次回実行で再試行されます）"
          fi
