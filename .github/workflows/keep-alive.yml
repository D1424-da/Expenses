name: Keep Render Alive

# **定期実行は止めてある。** 現在は手動実行のみ。
#
# ## なぜ止めたか
#
# Render 無料プランは15分アイドルでスリープし、復帰に30〜60秒かかる。
# それを防ぐために /api/health を10分ごとに叩いていたが、割に合わなかった。
#
# 1. **アプリ側に同じ仕組みがある。**
#    `static/app.js` の初期化で `prewarmOcr()`（ocr-client.js）が
#    /api/health を叩き、アプリを開いた時点で起動を始める。
#    利用者がレシートを撮るまでの間に起動が進むので、keep-alive が
#    守れるのは「開いた直後に即撮影する人」だけだった。
# 2. **費用が効果に見合わない。** GitHub Actions は**ジョブ1回につき
#    最低1分**課金される（10秒の curl でも1分）。
#      10分ごと・24時間 = 1日144回 = 約4,320分/月 = 約$35/月
#    2026-08 にこれで無料枠（2,000分/月）を使い切り、pytest・vitest・
#    Firebase Hosting へのデプロイまで全ワークフローが起動不能になった。
#    ジョブが3秒で失敗しログも残らないため、テストの失敗と紛らわしい。
#    **全ワークフローが数秒で落ちていたら、まず課金枠を疑うこと。**
# 3. **利用者が少ない時間帯に起こし続けても無駄になる。**
#
# ## 止めたことで残る影響
#
# Stripe の webhook。決済時に Render が寝ていると初回はタイムアウトし、
# Stripe が再送するまで「決済は済んだのにプレミアムにならない」状態が続く
# （Stripe は10秒で打ち切り、5日失敗が続くとエンドポイントを無効化する）。
# 24時間起こしておく必要が出たら、**GitHub Actions ではなく外部の無料
# 監視サービス**（UptimeRobot・cron-job.org など）を使うこと。
# Actions の枠を使わずに5分間隔で叩ける。
#
# ## 戻すとき
#
# 下の schedule のコメントを外す。ただし**実行回数 × 1分**で見積もること。
on:
  # schedule:
  #   - cron: "*/10 9-13 * * *"   # 18:00〜22:59 JST を10分ごと（約900分/月）
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          # curl 自体が失敗（DNS/タイムアウト等）しても set -e でジョブごと
          # 落とさないよう、失敗時は "000" にフォールバックする。
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            https://receipt-ocr-ejrl.onrender.com/api/health || echo "000")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Render is awake"
          else
            echo "⚠️ Render returned $STATUS（一時的なコールドスタートの可能性あり。次回実行で再試行されます）"
          fi
