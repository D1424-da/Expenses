name: Keep Render Alive

# Render 無料プランは 15 分アイドルでスリープする。
# 10 分ごとに /api/health を叩いてスリープを防ぐ。
# curl のみなので 1 回あたり約 10 秒・月間約 720 分の消費で済む。
on:
  schedule:
    - cron: "*/10 * * * *"   # 10分ごと（UTC）
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          # curl 自体が失敗（DNS/タイムアウト等）しても set -e でジョブごと
          # 落とさないよう、失敗時は "000" にフォールバックする。
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            https://receipt-ocr-ejrl.onrender.com/api/health || echo "000")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Render is awake"
          else
            echo "⚠️ Render returned $STATUS（一時的なコールドスタートの可能性あり。次回実行で再試行されます）"
          fi
