name: Firestore Rules Tests

# firestore.rules は利用者同士がお互いの家計簿を読めないようにしている
# 唯一の防壁。deploy-firestore-rules.yml もデプロイ直前に同じテストを通すが、
# そちらは main への push（＝マージ後）でしか走らない。壊れていることに
# マージしてから気づくのでは遅いので、PR の時点でも検出する。
#
# ルール関連のファイルが変わったときだけ走らせて、Actions の無料枠を
# 無駄に消費しないようにする（他のテストは test.yml が担当）。
on:
  pull_request:
    paths:
      - firestore.rules
      - firebase.json
      - tests-rules/**
      - vitest.rules.config.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    name: Firestore ルールテスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      # エミュレータ（Firestore / Auth）は Java 製
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Install deps
        run: npm ci --no-audit --no-fund
      # auth も起動するのは tests-rules/auth-integration.test.js が
      # Auth エミュレータ（9099）を使うため。firestore だけだと
      # ECONNREFUSED で17件が落ちる。
      - name: Run rules tests
        run: |
          firebase emulators:exec --only firestore,auth \
            --project expenses-9af61 "npm run test:rules"
