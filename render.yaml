# Render Blueprint（Docker 不要・Python ネイティブ）。
# Render ダッシュボードの「New +」→「Blueprint」でこのリポジトリを選ぶと、
# このファイルに従ってサービスが作成される。
#
# ⚠️ envVars の書き方で「どちらが正」かが変わる:
#   value: を書いた変数  → このファイルが正。Blueprint 同期時に
#                          ダッシュボードでの変更が上書き（巻き戻し）される。
#   sync: false の変数   → ダッシュボードが正。ファイル側は値を持たない。
#
# 運用中に切り替える設定（OCR エンジン・デバッグ保存など）を value: で
# 固定すると、デプロイのたびに設定が勝手に戻る。恒久的な既定値だけを
# value: に置き、運用で変えるものは sync: false にすること。
#
# 秘密情報（API キー等）は全て sync:false でダッシュボード入力（= Git に残さない）。
services:
  - type: web
    name: receipt-ocr
    runtime: python
    plan: free
    healthCheckPath: /api/health
    buildCommand: pip install -r requirements-gemini.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"   # Docker(python:3.11-slim)と揃える
      - key: FIREBASE_PROJECT_ID
        sync: false   # 設定すると /api/ocr を Firebase 認証必須にできる（任意）
      - key: RATE_PER_IP
        value: "10"   # IPあたり/分（簡易レート制限）
      - key: RATE_GLOBAL
        value: "60"   # 全体/分
      - key: OCR_ENGINE
        sync: false   # gemini=Developer API / vertex=Vertex AI(Google Cloud課金)。
                      # 課金状況で切り替えるためダッシュボード管理。
                      # 未設定時のコード既定は tesseract なので必ず設定すること。
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: CORS_ORIGINS
        sync: false   # 例: https://<ユーザー名>.github.io
      - key: GEMINI_API_KEY
        sync: false   # OCR_ENGINE=gemini 用。Cloud Shell で取得したキー（ダッシュボードで入力）
      - key: VISION_API_KEY
        sync: false   # 保険: AI 失敗時の Vision API フォールバック用（任意・ダッシュボードで入力）
      # ---- OCR_ENGINE=vertex（Vertex AI）を使う場合のみ設定 ----
      - key: GOOGLE_CLOUD_PROJECT
        sync: false   # 無料トライアル課金が紐づく GCP プロジェクトID
      - key: VERTEX_LOCATION
        value: us-central1   # リージョン（global も可）
      - key: VERTEX_MODEL
        sync: false   # 任意。未設定なら GEMINI_MODEL を使用
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false   # サービスアカウント鍵のJSON文字列（aiplatform.user 権限）
      # ---- アプリ改善用：レシート画像の一時保存（任意・既定は無効） ----
      - key: DEBUG_RETAIN_RECEIPTS
        sync: false   # "true" にするとOCR画像をFirebase Storageに一時保存する。
                      # 調査時だけ有効化する運用のためダッシュボード管理。
                      # 未設定時のコード既定は無効なので、消し忘れても保存はされない。
      - key: DEBUG_RETAIN_DAYS
        value: "3"   # 保存日数。実際の自動削除は storage-lifecycle.json のGCSライフサイクルルールで行う（値を変えたらそちらも合わせて更新）
      - key: ADMIN_UIDS
        sync: false   # /admin.html から一時保存レシートを閲覧できる Firebase UID（カンマ区切り・Firebase Console→Authenticationで確認）
      - key: FIREBASE_STORAGE_BUCKET
        sync: false   # 任意。未設定なら <FIREBASE_PROJECT_ID>.firebasestorage.app を使う（古いプロジェクトの .appspot.com 形式のときだけ明示する）
