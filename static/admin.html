<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>カケイシピ | 管理者用レシート確認</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
    h1 { font-size: 1.3rem; }
    .hint { color: #666; font-size: .85rem; line-height: 1.6; }
    #login-box, #main-box { display: none; }
    button { background: #2D7D52; color: #fff; border: none; border-radius: 8px; padding: 10px 20px; cursor: pointer; font-size: .95rem; }
    button:hover { opacity: .9; }
    #status { color: #b00; font-size: .85rem; margin-top: 8px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: .85rem; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eee; }
    th { color: #666; font-weight: 600; }
    .thumb { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; border: 1px solid #ddd; cursor: pointer; }
    .dl-link { color: #2D7D52; text-decoration: none; font-weight: 600; }
    .empty { color: #888; padding: 20px 0; }
  </style>
</head>
<body>
  <h1>🔒 管理者用：一時保存レシート確認</h1>
  <p class="hint">
    DEBUG_RETAIN_RECEIPTS=true のときに保存された画像（最長3日間・自動削除）の一覧です。
    ADMIN_UIDS に登録された管理者アカウントのみアクセスできます。
  </p>

  <div id="login-box">
    <button id="login-btn">Googleでログイン</button>
  </div>

  <div id="main-box">
    <button id="reload-btn">再読み込み</button>
    <span id="who" class="hint"></span>
    <table id="table" hidden>
      <thead><tr><th>プレビュー</th><th>uid</th><th>ファイル</th><th>サイズ</th><th>保存日時</th><th></th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <p id="empty" class="empty" hidden>該当する画像はありません。</p>
  </div>

  <p id="status"></p>

  <script type="module">
    import { auth, provider } from "./firebase-init.js";
    import { OCR_API_BASE } from "./firebase-config.js";
    import { signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const $ = (id) => document.getElementById(id);
    const statusEl = $("status");

    function fmtSize(bytes) {
      if (!bytes) return "-";
      const kb = bytes / 1024;
      return kb < 1024 ? `${kb.toFixed(1)} KB` : `${(kb / 1024).toFixed(1)} MB`;
    }

    async function loadList(token) {
      statusEl.textContent = "";
      const res = await fetch(`${OCR_API_BASE}/api/admin/receipts`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        statusEl.textContent = `エラー: ${res.status} ${body.detail ?? ""}`;
        $("table").hidden = true;
        $("empty").hidden = true;
        return;
      }
      const { items } = await res.json();
      const tbody = $("tbody");
      tbody.innerHTML = "";
      if (items.length === 0) {
        $("table").hidden = true;
        $("empty").hidden = false;
        return;
      }
      $("table").hidden = false;
      $("empty").hidden = true;
      for (const item of items) {
        const uid = item.name.split("/")[1] ?? "-";
        const filename = item.name.split("/").pop();
        const dlUrl = `${OCR_API_BASE}/api/admin/receipts/download?name=${encodeURIComponent(item.name)}`;

        const tr = document.createElement("tr");
        const tdThumb = document.createElement("td");
        const img = document.createElement("img");
        img.className = "thumb";
        img.loading = "lazy";
        img.alt = filename;
        // 画像取得も認証が要るため fetch → blob URL 化
        fetch(dlUrl, { headers: { Authorization: `Bearer ${token}` } })
          .then((r) => (r.ok ? r.blob() : null))
          .then((blob) => { if (blob) img.src = URL.createObjectURL(blob); })
          .catch(() => {});
        tdThumb.appendChild(img);

        const tdUid = document.createElement("td");
        tdUid.textContent = uid;
        const tdName = document.createElement("td");
        tdName.textContent = filename;
        const tdSize = document.createElement("td");
        tdSize.textContent = fmtSize(item.size);
        const tdDate = document.createElement("td");
        tdDate.textContent = item.createdAt ? new Date(item.createdAt).toLocaleString("ja-JP") : "-";

        const tdDl = document.createElement("td");
        const a = document.createElement("a");
        a.textContent = "ダウンロード";
        a.className = "dl-link";
        a.href = "#";
        a.onclick = async (e) => {
          e.preventDefault();
          const r = await fetch(dlUrl, { headers: { Authorization: `Bearer ${token}` } });
          if (!r.ok) { statusEl.textContent = "ダウンロードに失敗しました"; return; }
          const blob = await r.blob();
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = filename;
          link.click();
          URL.revokeObjectURL(url);
        };
        tdDl.appendChild(a);

        tr.append(tdThumb, tdUid, tdName, tdSize, tdDate, tdDl);
        tbody.appendChild(tr);
      }
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        $("login-box").style.display = "block";
        $("main-box").style.display = "none";
        return;
      }
      $("login-box").style.display = "none";
      $("main-box").style.display = "block";
      $("who").textContent = `ログイン中: ${user.email}`;
      const token = await user.getIdToken();
      await loadList(token);
      $("reload-btn").onclick = async () => {
        const t = await user.getIdToken(true);
        await loadList(t);
      };
    });

    $("login-btn").onclick = () => signInWithPopup(auth, provider).catch((e) => {
      statusEl.textContent = `ログイン失敗: ${e.message}`;
    });
  </script>
</body>
</html>
