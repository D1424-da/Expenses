<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>カケイシピ | 管理者用レシート確認</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
    h1 { font-size: 1.3rem; }
    .hint { color: #666; font-size: .85rem; line-height: 1.6; }
    #login-box, #main-box { display: none; }
    button { background: #2D7D52; color: #fff; border: none; border-radius: 8px; padding: 10px 20px; cursor: pointer; font-size: .95rem; }
    button:hover { opacity: .9; }
    #status { color: #b00; font-size: .85rem; margin-top: 8px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: .85rem; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eee; }
    th { color: #666; font-weight: 600; }
    .thumb { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; border: 1px solid #ddd; cursor: pointer; }
    .dl-link { color: #2D7D52; text-decoration: none; font-weight: 600; }
    .empty { color: #888; padding: 20px 0; }
    /* 拡大ビューア */
    #viewer {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,.85);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      padding: 24px;
    }
    #viewer[hidden] { display: none; }
    #viewer-img { max-width: 92vw; max-height: 80vh; object-fit: contain; background: #fff; }
    #viewer-caption { color: #fff; font-size: .85rem; word-break: break-all; text-align: center; }
    #viewer-hint { color: rgba(255,255,255,.7); font-size: .78rem; }
  </style>
</head>
<body>
  <h1>🔒 管理者用：一時保存レシート確認</h1>
  <p class="hint">
    DEBUG_RETAIN_RECEIPTS=true のときに保存された画像（最長3日間・自動削除）の一覧です。
    ADMIN_UIDS に登録された管理者アカウントのみアクセスできます。
  </p>

  <div id="login-box">
    <button id="login-btn">Googleでログイン</button>
  </div>

  <div id="main-box">
    <button id="reload-btn">再読み込み</button>
    <span id="who" class="hint"></span>
    <table id="table" hidden>
      <thead><tr><th>プレビュー</th><th>uid</th><th>ファイル</th><th>サイズ</th><th>保存日時</th><th></th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <p id="empty" class="empty" hidden>該当する画像はありません。</p>
  </div>

  <p id="status"></p>

  <!-- 拡大ビューア（サムネイルをクリックすると原寸を表示する） -->
  <div id="viewer" hidden>
    <img id="viewer-img" alt="レシート画像（拡大）" />
    <p id="viewer-caption"></p>
    <p id="viewer-hint">背景をクリック、または Esc キーで閉じます</p>
  </div>

  <script type="module" src="/admin.js"></script>
</body>
</html>
